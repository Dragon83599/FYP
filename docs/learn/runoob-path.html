<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>runoob 学习路径 · 心音五分类 FYP</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #16181d; --bg: #f7f7f9; --card: #fff; --muted: #6b7280;
    --line: #e5e7eb; --accent: #0a7d32; --must: #0a7d32; --opt: #a16207; --skip: #9ca3af;
    --done-bg: #ecfdf3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8ea; --bg: #121316; --card: #1b1d22; --muted: #9aa0aa;
            --line: #2c2f36; --accent: #6cd58b; --must: #6cd58b; --opt: #e0a94a;
            --skip: #6b7280; --done-bg: #12301f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: .7rem 1rem .6rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .35rem; }
  .sub { color: var(--muted); font-size: .8rem; margin: 0 0 .55rem; }
  .bar { height: .5rem; background: var(--line); border-radius: .3rem; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .row { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-top: .55rem; }
  button, input[type=search] { font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: .45rem; padding: .3rem .6rem; }
  button { cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  input[type=search] { flex: 1 1 10rem; min-width: 8rem; }
  main { padding: .8rem 1rem 4rem; max-width: 52rem; margin: 0 auto; }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  li { counter-increment: step; background: var(--card); border: 1px solid var(--line);
       border-radius: .6rem; padding: .7rem .8rem .6rem 2.9rem; margin-bottom: .6rem;
       position: relative; }
  li.done { background: var(--done-bg); }
  li::before { content: counter(step); position: absolute; left: .7rem; top: .65rem;
       width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--line);
       color: var(--fg); font-size: .78rem; font-weight: 700;
       display: flex; align-items: center; justify-content: center; }
  li.done::before { background: var(--accent); color: #fff; }
  .title { font-weight: 600; margin: 0 0 .15rem; }
  .title a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .title a:hover { border-bottom-style: solid; }
  .tier { font-size: .68rem; font-weight: 700; padding: .05rem .35rem; border-radius: .25rem;
          border: 1px solid currentColor; margin-left: .35rem; vertical-align: .1em; }
  .tier.must { color: var(--must); } .tier.opt { color: var(--opt); } .tier.skip { color: var(--skip); }
  .why { color: var(--muted); font-size: .84rem; margin: .1rem 0 .25rem; }
  .check { font-size: .84rem; margin: .1rem 0 .35rem; }
  .check b { color: var(--accent); font-weight: 600; }
  .note { font-size: .82rem; background: #a1620715; border-left: 3px solid var(--opt);
          padding: .35rem .5rem; border-radius: .25rem; margin: .15rem 0 .35rem; }
  .note a { color: var(--opt); }
  .cmd { display: flex; gap: .4rem; align-items: flex-start; margin-top: .3rem; }
  .cmd code { flex: 1; background: #8881; border-radius: .35rem; padding: .35rem .5rem;
              font: .76rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
              white-space: pre-wrap; word-break: break-all; }
  .cmd button { padding: .15rem .45rem; font-size: .74rem; }
  label.donebox { position: absolute; right: .7rem; top: .65rem; display: flex; gap: .3rem;
                  align-items: center; font-size: .74rem; color: var(--muted); cursor: pointer; }
  input[type=checkbox] { width: 1.05rem; height: 1.05rem; accent-color: var(--accent); }
  #empty { color: var(--muted); text-align: center; padding: 2rem 0; display: none; }
  footer { max-width: 52rem; margin: 0 auto; padding: 0 1rem 3rem; color: var(--muted); font-size: .78rem; }
  @media print { header .row, label.donebox, .cmd button, footer { display: none; } li { break-inside: avoid; } }
</style>
</head>
<body>
<header>
  <h1>runoob 学习路径 · 按顺序</h1>
  <p class="sub" id="summary">共 <b id="total">0</b> 条 · 已学 <b id="doneCount">0</b> 条</p>
  <div class="bar"><i id="progress"></i></div>
  <div class="row">
    <button data-filter="all" class="on">全部</button>
    <button data-filter="must">只看必学</button>
    <button data-filter="todo">未完成</button>
    <button data-filter="opt">选学</button>
    <input type="search" id="q" placeholder="搜索：F1 / 交叉验证 / Git / SciPy…" />
    <button id="copy">复制进度</button>
    <button id="reset">重置</button>
  </div>
</header>

<main>
  <ol id="list"></ol>
  <p id="empty">没有匹配的条目。</p>
</main>

<footer>
  进度保存在本浏览器的 localStorage；换设备或清缓存会丢，可用「复制进度」留档。
  链接指向 <a href="https://www.runoob.com/" target="_blank" rel="noopener">runoob.com</a>，内容以站方为准。
</footer>

  { t: "NumPy · 统计与 axis", u: "https://www.runoob.com/numpy/numpy-tutorial.html", tier: "must",
    why: "算均值、标准差、按列求和（混淆矩阵算 F1）全靠 axis。",
    check: "对一个 5×5 矩阵分别按行、按列求和，说出 axis 的区别。" },
  { t: "NumPy · 广播", u: "https://www.runoob.com/numpy/numpy-tutorial.html", tier: "opt",
    why: "预处理的归一化、概率批量处理会用到。",
    check: "用一个标量去乘整个数组，再用不同形状的两个数组相加。" },
  { t: "NumPy · 随机数", u: "https://www.runoob.com/numpy/numpy-tutorial.html", tier: "opt",

  { t: "机器学习 · 特征工程", u: "https://www.runoob.com/ml/ml-feature-engineering.html", tier: "opt",

  { t: "机器学习 · 训练集 / 测试集划分", u: "https://www.runoob.com/ml/ml-training-and-test-set-splitting.html", tier: "must",
    why: "为什么不能拿训练数据评估——这是全部评估的地基。",
    check: "说清“用训练数据评估”为什么等于作弊。" },
  { t: "机器学习 · 交叉验证", u: "https://www.runoob.com/ml/ml-cross-validation.html", tier: "must",
    why: "我们的 98.40% 就是 10 折交叉验证的均值。",
    check: "说清 10 折里每一折的“课本”和“考卷”分别是什么。" },

  { t: "机器学习 · 过拟合 / 欠拟合 / 偏差与方差", u: "https://www.runoob.com/ml/ml-overfitting-underfitting-bias-and-variance.html", tier: "must",

const FILTERS = { all: () => true, must: (i) => i.tier === "must", opt: (i) => i.tier === "opt",
                  todo: (i, n) => !done.has(n) };
const TIER_LABEL = { must: "必学", opt: "选学", skip: "不学" };
const STORE = "runoob-path-v1";

const listEl = document.getElementById("list");
const emptyEl = document.getElementById("empty");
const totalEl = document.getElementById("total");
const doneCountEl = document.getElementById("doneCount");
const progressEl = document.getElementById("progress");
const summaryEl = document.getElementById("summary");
const qEl = document.getElementById("q");

let filter = "all";
let query = "";
const done = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) JSON.parse(raw).forEach((n) => done.add(n));
  } catch (e) { /* 隐私模式或 file:// 限制：照常工作，只是不保存 */ }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify([...done])); } catch (e) {}
}

function matches(item, n) {
  if (!FILTERS[filter](item, n)) return false;
  if (!query) return true;
  const hay = (item.t + " " + item.why + " " + item.check).toLowerCase();
  return hay.includes(query);
}

function render() {
  listEl.innerHTML = "";
  let shown = 0;
  ITEMS.forEach((item, idx) => {
    const n = idx + 1;
    if (!matches(item, n)) return;
    shown += 1;
    const li = document.createElement("li");
    li.className = done.has(n) ? "done" : "";

    const title = document.createElement("p");
    title.className = "title";
    const a = document.createElement("a");
    a.href = item.u;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = item.t;
    title.appendChild(a);
    const tier = document.createElement("span");
    tier.className = "tier " + item.tier;
    tier.textContent = TIER_LABEL[item.tier];
    title.appendChild(tier);
    li.appendChild(title);

    const why = document.createElement("p");
    why.className = "why";
    why.textContent = item.why;
    li.appendChild(why);

    const check = document.createElement("p");
    check.className = "check";
    check.innerHTML = "<b>学完要能回答：</b>";
    check.appendChild(document.createTextNode(item.check));
    li.appendChild(check);

    if (item.note) {
      const note = document.createElement("p");
      note.className = "note";
      note.textContent = item.note + " ";
      if (item.alt) {
        const altLink = document.createElement("a");
        altLink.href = item.alt;
        altLink.target = "_blank";
        altLink.rel = "noopener";
        altLink.textContent = "打开官方文档 →";
        note.appendChild(altLink);
      }
      li.appendChild(note);
    }

    const box = document.createElement("label");
    box.className = "donebox";
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = done.has(n);
    cb.setAttribute("aria-label", "标记第 " + n + " 条为已学");
    cb.addEventListener("change", () => {
      if (cb.checked) done.add(n); else done.delete(n);
      save();
      li.classList.toggle("done", cb.checked);
      updateProgress();
    });
    box.appendChild(cb);
    box.appendChild(document.createTextNode("已学"));
    li.appendChild(box);

    listEl.appendChild(li);
  });
  emptyEl.style.display = shown ? "none" : "block";
  updateProgress();
}

function updateProgress() {
  const mustTotal = ITEMS.filter((i) => i.tier === "must").length;
  const mustDone = ITEMS.filter((i, idx) => i.tier === "must" && done.has(idx + 1)).length;
  totalEl.textContent = ITEMS.length;
  doneCountEl.textContent = done.size;
  progressEl.style.width = (mustTotal ? (mustDone / mustTotal) * 100 : 0) + "%";
  summaryEl.innerHTML = "共 <b>" + ITEMS.length + "</b> 条 · 已学 <b>" + done.size +
    "</b> 条 · 必学进度 <b>" + mustDone + "/" + mustTotal + "</b>（进度条按必学算）";
}

document.querySelectorAll("[data-filter]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-filter]").forEach((b) => b.classList.remove("on"));
    btn.classList.add("on");
    filter = btn.dataset.filter;
    render();
  });
});

qEl.addEventListener("input", () => { query = qEl.value.trim().toLowerCase(); render(); });

document.getElementById("copy").addEventListener("click", async () => {
  const lines = ["runoob 学习路径进度：已学 " + done.size + "/" + ITEMS.length];
  ITEMS.forEach((item, idx) => {
    const n = idx + 1;
    lines.push((done.has(n) ? "[x] " : "[ ] ") + n + ". " + item.t + (item.tier === "must" ? "（必学）" : ""));
  });
  const text = lines.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    summaryEl.textContent = "进度已复制到剪贴板";
  } catch (e) {
    window.prompt("复制下面这段：", text);
  }
});

document.getElementById("reset").addEventListener("click", () => {
  if (!confirm("清空全部已学标记？")) return;
  done.clear();
  save();
  render();
});

load();
render();
</script>

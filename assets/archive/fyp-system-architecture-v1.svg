    <text x="96" y="222" text-anchor="middle" fill="#187a68" font-size="18" font-weight="700">1</text>
    <text x="130" y="216" fill="#17333d" font-size="18" font-weight="700">ACQUISITION FRONT END</text>
    <text x="130" y="240" fill="#78909a" font-size="12">sensor to digital samples</text>

    <circle cx="531" cy="216" r="20" fill="#e8f0ff" stroke="#4d83d8" stroke-width="2"/>
    <text x="531" y="222" text-anchor="middle" fill="#315fae" font-size="18" font-weight="700">2</text>
    <text x="565" y="216" fill="#17333d" font-size="18" font-weight="700">EMBEDDED CAPTURE</text>
    <text x="565" y="240" fill="#78909a" font-size="12">buffer, frame, protocol</text>

    <circle cx="966" cy="216" r="20" fill="#fff1e5" stroke="#e49a58" stroke-width="2"/>
    <text x="966" y="222" text-anchor="middle" fill="#a7652d" font-size="18" font-weight="700">3</text>
    <text x="1000" y="216" fill="#17333d" font-size="18" font-weight="700">LINK, STORAGE &amp; HMI</text>
    <text x="1000" y="240" fill="#78909a" font-size="12">wireless, local, display</text>

    <circle cx="1401" cy="216" r="20" fill="#ffebeb" stroke="#ef7f7f" stroke-width="2"/>
    <text x="1401" y="222" text-anchor="middle" fill="#b44d4d" font-size="18" font-weight="700">4</text>
    <text x="1435" y="216" fill="#17333d" font-size="18" font-weight="700">HOST AI &amp; RESULT</text>

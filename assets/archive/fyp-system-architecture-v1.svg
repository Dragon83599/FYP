<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfe"/>
      <stop offset="0.55" stop-color="#f1f6f8"/>
      <stop offset="1" stop-color="#e4eef2"/>
    </linearGradient>

    <linearGradient id="stageFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbfc"/>
    </linearGradient>

    <linearGradient id="blockFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fafb"/>
      <stop offset="1" stop-color="#eaf2f5"/>
    </linearGradient>

    <linearGradient id="audioLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ea88f"/>
      <stop offset="1" stop-color="#58dfc1"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#31515f" flood-opacity="0.13"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#a6bec8" opacity="0.25"/>
    </pattern>

    <marker id="arrowAudio" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 z" fill="#2ab99b"/>
    </marker>
    <marker id="arrowControl" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 z" fill="#4d83d8"/>
    </marker>
    <marker id="arrowResult" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L12 6 L0 12 z" fill="#ef7f7f"/>
    </marker>

    <path id="iconHeart" d="M -18 -18 C -8 -36 10 -34 18 -18 C 26 -34 44 -36 54 -18 C 52 4 22 20 18 30 C 14 20 -16 4 -18 -18 Z"/>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg)"/>
  <rect width="1800" height="1100" fill="url(#dotGrid)"/>

  <text x="60" y="76" fill="#17333d" font-family="Arial, sans-serif" font-size="34" font-weight="700">FYP SYSTEM ARCHITECTURE</text>
  <text x="60" y="112" fill="#617b86" font-family="Arial, sans-serif" font-size="16">Heart-sound acquisition, embedded framing, wireless transport, and AI analysis</text>
  <text x="60" y="138" fill="#8aa0aa" font-family="Arial, sans-serif" font-size="13">Module connection view · frozen baseline v0.1</text>

  <g transform="translate(1110 48)">
    <rect x="0" y="0" width="630" height="98" rx="18" fill="#ffffff" stroke="#d5e3e8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <line x1="24" y1="32" x2="68" y2="32" stroke="#2ab99b" stroke-width="5" stroke-linecap="round"/>
    <line x1="68" y1="32" x2="78" y2="32" stroke="#2ab99b" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowAudio)"/>
    <text x="92" y="37" fill="#31505c" font-family="Arial, sans-serif" font-size="13">Audio / frame data</text>

    <line x1="240" y1="32" x2="292" y2="32" stroke="#4d83d8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/>
    <line x1="292" y1="32" x2="302" y2="32" stroke="#4d83d8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowControl)"/>
    <text x="316" y="37" fill="#31505c" font-family="Arial, sans-serif" font-size="13">Control / sync</text>

    <line x1="468" y1="32" x2="520" y2="32" stroke="#ef7f7f" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 6"/>
    <line x1="520" y1="32" x2="530" y2="32" stroke="#ef7f7f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowResult)"/>
    <text x="544" y="37" fill="#31505c" font-family="Arial, sans-serif" font-size="13">AI result</text>

    <text x="24" y="72" fill="#8aa0aa" font-family="Arial, sans-serif" font-size="12">Solid = data path · Dashed = control or result path</text>
  </g>

  <g filter="url(#cardShadow)">
